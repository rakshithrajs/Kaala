[project]
name = "kinda-jarvis"
version = "0.1.0"
description = "The Proactive AI Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.9.0",
    "apscheduler>=3.11.0",
    "certifi==2025.6.15",
    "dotenv>=0.9.9",
    "google-genai>=1.31.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.10",
    "numpy>=2.0.0",
    "pydantic>=2.11.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.1.0",
    "pytz>=2025.2",
    "six>=1.17.0",
    "sniffio>=1.3.0",
    "typing-extensions>=4.14.0",
    "typing-inspection>=0.4.0",
    "tzdata>=2025.2",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
]

[tool.pylint]
ignore = [".venv", "build", "data", "__pycache__"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
